# pnpm 12 blocks packages younger than its default minimumReleaseAge. The pinned
# versions below were newer than that at install time, so pnpm listed them here
# (see `pnpm install` output). Entries are version-exact and age out naturally;
# set `minimumReleaseAge: 0` here to drop the policy entirely.

minimumReleaseAgeExclude:
  - '@biomejs/biome@2.5.13'
  - '@biomejs/cli-darwin-x64@2.5.13'
  - '@biomejs/cli-linux-arm64-musl@2.5.13'
  - '@biomejs/cli-linux-arm64@2.5.13'
  - '@biomejs/cli-linux-x64-musl@2.5.13'
  - '@biomejs/cli-linux-x64@2.5.13'
  - '@biomejs/cli-win32-arm64@2.5.13'
  - '@biomejs/cli-win32-x64@2.5.13'
  - '@tanstack/react-router@1.170.35'
  - '@tanstack/react-start-client@1.168.33'
  - '@tanstack/react-start-rsc@0.1.51'
  - '@tanstack/react-start-server@1.167.40'
  - '@tanstack/react-start@1.168.52'
  - '@tanstack/start-plugin-core@1.171.42'
  - '@tanstack/start-server-core@1.169.34'
  - lint-staged@17.5.1
  - vite@8.3.0
